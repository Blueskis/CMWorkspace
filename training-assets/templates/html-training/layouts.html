<!--
  Layout definitions for the generic training HTML template.

  Each <template data-layout="..."> is one layout, equivalent to a slideLayout
  in a .potx. Placeholders are {{name}} tokens; the names here MUST match the
  placeholder names in template_profile.json, since that profile is what
  build_deck.py validates a training plan against.

  Optional regions wrap in {{#name}}...{{/name}} — the renderer drops the whole
  block when that placeholder has no content, so a layout degrades cleanly
  rather than leaving an empty panel behind.

  Two layouts carry the shape this template exists for:

    * screenshot-walkthrough — numbered steps beside the screen capture. The
      callouts are text in their own column, NOT burned onto the image, so the
      screenshot stays an unmodified artifact of the spec and the steps stay
      editable and translatable.
    * knowledge-check — the five questions. Answers never appear here; they are
      generated into the speaker notes.

  Editing a layout here changes every deck built from this template. No Python
  changes needed — but re-run profile_template.py afterwards so the profile
  stays in step.
-->

<template data-layout="title-slide">
  <div class="slide-frame layout-title-slide">
    <div class="slide-body">
      <div class="course">{{course}}</div>
      <h1>{{title}}</h1>
      {{#subtitle}}<p class="subtitle">{{subtitle}}</p>{{/subtitle}}
      <div class="meta">{{meta}}</div>
    </div>
  </div>
</template>

<template data-layout="section-header">
  <div class="slide-frame layout-section-header">
    <div class="slide-body">
      {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
      <h1>{{title}}</h1>
      {{#body}}{{body}}{{/body}}
    </div>
  </div>
</template>

<template data-layout="objectives">
  <div class="slide-frame layout-objectives">
    <div class="slide-body">
      {{#kicker}}<div class="kicker">{{kicker}}</div>{{/kicker}}
      <h2>{{title}}</h2>
      <p class="lead">By the end of this session you will be able to:</p>
      {{objectives}}
    </div>
    {{#footer}}{{footer}}{{/footer}}
  </div>
</template>

        <div>

          {{#caption}}<figcaption>{{caption}}</figcaption>{{/caption}}

  </div>
</template>
