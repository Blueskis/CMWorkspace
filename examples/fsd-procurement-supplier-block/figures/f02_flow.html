<meta charset="utf-8"><link rel="stylesheet" href="base.css"><body style="width:1160px;padding:10px;background:#fff">
<svg width="1140" height="700" xmlns="http://www.w3.org/2000/svg" font-family="Arial">
<defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#54687c"/></marker></defs>
<rect x="0" y="0" width="1140" height="700" fill="#fff" stroke="#d6dee6"/>
<line x1="240" y1="20" x2="240" y2="680" stroke="#dfe6ed"/><line x1="480" y1="20" x2="480" y2="680" stroke="#dfe6ed"/><line x1="720" y1="20" x2="720" y2="680" stroke="#dfe6ed"/><line x1="920" y1="20" x2="920" y2="680" stroke="#dfe6ed"/>
<rect x="0" y="20" width="1140" height="30" fill="#eef4fa"/>
<text x="120" y="40" font-size="12" font-weight="bold" fill="#0a3d6e" text-anchor="middle">Requester (Procurement)</text>
<text x="360" y="40" font-size="12" font-weight="bold" fill="#0a3d6e" text-anchor="middle">ZMM_SUPPLIER_BLOCK</text>
<text x="600" y="40" font-size="12" font-weight="bold" fill="#0a3d6e" text-anchor="middle">Approver (Cat. Mgr / Compliance)</text>
<text x="820" y="40" font-size="12" font-weight="bold" fill="#0a3d6e" text-anchor="middle">S/4HANA Core (BP / Vendor)</text>
<text x="1030" y="40" font-size="12" font-weight="bold" fill="#0a3d6e" text-anchor="middle">Downstream</text>

<ellipse cx="120" cy="85" rx="70" ry="22" fill="#e8f6ea" stroke="#107e3e"/><text x="120" y="90" font-size="11" text-anchor="middle" fill="#0a4d26">Start: block trigger</text>
<rect x="35" y="130" width="170" height="46" rx="4" fill="#eef4fa" stroke="#4a6c8f"/><text x="120" y="149" font-size="11" text-anchor="middle" fill="#243b52">1. Select supplier and</text><text x="120" y="164" font-size="11" text-anchor="middle" fill="#243b52">block scope</text>
<rect x="35" y="196" width="170" height="46" rx="4" fill="#eef4fa" stroke="#4a6c8f"/><text x="120" y="215" font-size="11" text-anchor="middle" fill="#243b52">2. Enter reason code,</text><text x="120" y="230" font-size="11" text-anchor="middle" fill="#243b52">dates, attachment</text>

<rect x="275" y="196" width="170" height="46" rx="4" fill="#fff4e0" stroke="#e9730c"/><text x="360" y="215" font-size="11" text-anchor="middle" fill="#6b3d00">3. Validate authority,</text><text x="360" y="230" font-size="11" text-anchor="middle" fill="#6b3d00">open docs, duplicates</text>
<path d="M360,270 L440,305 L360,340 L280,305 z" fill="#fff" stroke="#54687c"/><text x="360" y="302" font-size="10" text-anchor="middle" fill="#243b52">Validation</text><text x="360" y="315" font-size="10" text-anchor="middle" fill="#243b52">passed?</text>
<rect x="35" y="282" width="170" height="46" rx="4" fill="#ffebeb" stroke="#bb0000"/><text x="120" y="301" font-size="11" text-anchor="middle" fill="#5e0000">3a. Error message;</text><text x="120" y="316" font-size="11" text-anchor="middle" fill="#5e0000">correct and resubmit</text>
<rect x="275" y="370" width="170" height="46" rx="4" fill="#eef4fa" stroke="#4a6c8f"/><text x="360" y="389" font-size="11" text-anchor="middle" fill="#243b52">4. Persist request,</text><text x="360" y="404" font-size="11" text-anchor="middle" fill="#243b52">status = IN APPROVAL</text>

<rect x="515" y="370" width="170" height="46" rx="4" fill="#eef4fa" stroke="#4a6c8f"/><text x="600" y="389" font-size="11" text-anchor="middle" fill="#243b52">5. Approve / reject in</text><text x="600" y="404" font-size="11" text-anchor="middle" fill="#243b52">My Inbox (2 steps)</text>
<path d="M600,440 L680,475 L600,510 L520,475 z" fill="#fff" stroke="#54687c"/><text x="600" y="478" font-size="10" text-anchor="middle" fill="#243b52">Approved?</text>
<rect x="515" y="545" width="170" height="42" rx="4" fill="#ffebeb" stroke="#bb0000"/><text x="600" y="563" font-size="11" text-anchor="middle" fill="#5e0000">5a. Status = REJECTED,</text><text x="600" y="578" font-size="11" text-anchor="middle" fill="#5e0000">notify requester</text>

<rect x="740" y="440" width="160" height="60" rx="4" fill="#eef4fa" stroke="#4a6c8f"/><text x="820" y="459" font-size="11" text-anchor="middle" fill="#243b52">6. Set block flags</text><text x="820" y="474" font-size="11" text-anchor="middle" fill="#243b52">LFA1-SPERR / SPERM,</text><text x="820" y="489" font-size="11" text-anchor="middle" fill="#243b52">LFB1-SPERR, LFM1-SPERM</text>
<rect x="740" y="520" width="160" height="46" rx="4" fill="#eef4fa" stroke="#4a6c8f"/><text x="820" y="539" font-size="11" text-anchor="middle" fill="#243b52">7. Write audit log +</text><text x="820" y="554" font-size="11" text-anchor="middle" fill="#243b52">change document</text>

<rect x="950" y="440" width="160" height="46" rx="4" fill="#eef4fa" stroke="#4a6c8f"/><text x="1030" y="459" font-size="11" text-anchor="middle" fill="#243b52">8. Publish BP change</text><text x="1030" y="474" font-size="11" text-anchor="middle" fill="#243b52">event to Ariba / SAC</text>
<ellipse cx="1030" cy="545" rx="70" ry="22" fill="#e8f6ea" stroke="#107e3e"/><text x="1030" y="550" font-size="11" text-anchor="middle" fill="#0a4d26">End: supplier blocked</text>

<line x1="120" y1="107" x2="120" y2="128" stroke="#54687c" marker-end="url(#b)"/>
<line x1="120" y1="176" x2="120" y2="194" stroke="#54687c" marker-end="url(#b)"/>
<line x1="205" y1="219" x2="273" y2="219" stroke="#54687c" marker-end="url(#b)"/>
<line x1="360" y1="242" x2="360" y2="268" stroke="#54687c" marker-end="url(#b)"/>
<line x1="280" y1="305" x2="207" y2="305" stroke="#54687c" marker-end="url(#b)"/><text x="243" y="298" font-size="10" fill="#bb0000" text-anchor="middle">No</text>
<line x1="360" y1="340" x2="360" y2="368" stroke="#54687c" marker-end="url(#b)"/><text x="375" y="358" font-size="10" fill="#107e3e">Yes</text>
<line x1="445" y1="393" x2="513" y2="393" stroke="#54687c" marker-end="url(#b)"/>
<line x1="600" y1="416" x2="600" y2="438" stroke="#54687c" marker-end="url(#b)"/>
<line x1="600" y1="510" x2="600" y2="543" stroke="#54687c" marker-end="url(#b)"/><text x="615" y="530" font-size="10" fill="#bb0000">No</text>
<line x1="680" y1="475" x2="738" y2="472" stroke="#54687c" marker-end="url(#b)"/><text x="708" y="466" font-size="10" fill="#107e3e" text-anchor="middle">Yes</text>
<line x1="820" y1="500" x2="820" y2="518" stroke="#54687c" marker-end="url(#b)"/>
<line x1="900" y1="463" x2="948" y2="463" stroke="#54687c" marker-end="url(#b)"/>
<line x1="1030" y1="486" x2="1030" y2="521" stroke="#54687c" marker-end="url(#b)"/>
<rect x="20" y="620" width="1100" height="60" fill="#fbfcfd" stroke="#dfe6ed"/>
<text x="35" y="640" font-size="11" fill="#5a6b7c">Unblock follows the identical path; step 6 clears the same indicators and step 2 requires a release reason code (RL*) plus evidence reference.</text>
<text x="35" y="658" font-size="11" fill="#5a6b7c">Mass mode (background job) skips steps 1&#8211;2 and reads a pre-approved input file; approval is captured on the file, not per supplier.</text>
</svg></body>
