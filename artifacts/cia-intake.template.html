<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Change Impact Intake</title>
<style id="app-style">
:root{
  color-scheme: light dark;
  --paper:#F3F5F9;
  --surface:#FFFFFF;
  --surface-2:#EAEEF5;
  --ink:#12161F;
  --ink-2:#4C5666;
  --ink-3:#7A8494;
  --line:#DCE1EA;
  --line-strong:#BFC7D4;
  --accent:#2E3D77;
  --accent-ink:#FFFFFF;
  --accent-soft:#E4E8F6;
  --jade:#0B6B54;
  --jade-soft:#E0F0EA;
  --amber:#8C5E0C;
  --amber-soft:#F7EBD5;
  --clay:#A33D2E;
  --clay-soft:#F7E4E0;
  --shadow: 0 1px 2px rgba(18,22,31,.06), 0 8px 24px -16px rgba(18,22,31,.35);
  --font-display: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1117;
    --surface:#171B23;
    --surface-2:#1F242E;
    --ink:#E8EBF2;
    --ink-2:#A5AEBD;
    --ink-3:#7B8494;
    --line:#2A303B;
    --line-strong:#3B4351;
    --accent:#97A5EA;
    --accent-ink:#10131B;
    --accent-soft:#1C2340;
    --jade:#4FC7A0;
    --jade-soft:#12302A;
    --amber:#D9A54E;
    --amber-soft:#2E2617;
    --clay:#E38375;
    --clay-soft:#33201D;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1117;
  --surface:#171B23;
  --surface-2:#1F242E;
  --ink:#E8EBF2;
  --ink-2:#A5AEBD;
  --ink-3:#7B8494;
  --line:#2A303B;
  --line-strong:#3B4351;
  --accent:#97A5EA;
  --accent-ink:#10131B;
  --accent-soft:#1C2340;
  --jade:#4FC7A0;
  --jade-soft:#12302A;
  --amber:#D9A54E;
  --amber-soft:#2E2617;
  --clay:#E38375;
  --clay-soft:#33201D;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:88px;
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important;} }

h1{ font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0; letter-spacing:-0.01em; }

.appbar{
  position:sticky; top:0; z-index:20;
  display:flex; flex-wrap:wrap; align-items:center; gap:16px;
  padding:12px 24px;
  background:var(--surface);
  border-bottom:1px solid var(--line);
}
.brand{ display:flex; flex-direction:column; margin-right:auto; gap:2px; }
.brand h1{ font-size:1.3rem; }
.brand small{ color:var(--ink-3); font-size:.78rem; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

.page{ max-width:880px; margin:0 auto; padding:32px 24px 40px; }

.eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-3); margin:0 0 8px; }
.lede{ color:var(--ink-2); max-width:62ch; margin:0 0 32px; font-size:15px; }

.letterhead{ display:flex; flex-wrap:wrap; gap:20px; margin-bottom:32px; }
.letterhead .field{ flex:1 1 180px; }

.field{ display:flex; flex-direction:column; gap:6px; }
.field.grow{ flex:1 1 auto; }
.field > span{ font-size:.78rem; font-weight:500; color:var(--ink-2); }
.field > span em{ font-style:normal; font-weight:400; opacity:0.85; }

input[type="text"], input[type="date"], select, textarea{
  font-family:var(--font-body);
  font-size:14.5px;
  color:var(--ink);
  background:var(--surface);
  border:1px solid var(--line-strong);
  border-radius:6px;
  padding:8px 10px;
  width:100%;
  min-width:0;
}
textarea{ resize:vertical; min-height:70px; line-height:1.6; font-family:var(--font-body); }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
  border-radius:4px;
}
input:disabled, textarea:disabled, select:disabled{ opacity:0.7; }

.modes{ display:flex; gap:8px; margin-bottom:28px; flex-wrap:wrap; }
.mode-btn{
  flex:1 1 260px; text-align:left; cursor:pointer;
  background:var(--surface); border:1px solid var(--line-strong); border-radius:10px;
  padding:14px 16px; display:flex; flex-direction:column; gap:3px;
  font-family:var(--font-body); color:var(--ink);
  transition:border-color .12s ease, background .12s ease;
}
.mode-btn:hover{ background:var(--surface-2); }
.mode-btn strong{ font-size:.92rem; font-weight:600; }
.mode-btn span{ font-size:.78rem; color:var(--ink-2); line-height:1.45; }
.mode-active{ border-color:var(--accent); background:var(--accent-soft); }
.mode-active strong{ color:var(--accent); }
.mode-active span{ color:var(--ink-2); }

.baseline-panel{ display:flex; flex-direction:column; gap:18px; }
.baseline-meta{ display:flex; flex-wrap:wrap; gap:16px; }
.baseline-meta .field{ flex:1 1 200px; }
.filelist{ display:flex; flex-direction:column; gap:8px; }
.fileitem{
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  background:var(--surface-2); border:1px solid var(--line-strong); border-radius:6px;
}
.fileitem .mono{ font-family:var(--font-mono); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fileitem .file-size{ margin-left:auto; }
.filecap{ font-size:12px; color:var(--ink-3); font-family:var(--font-mono); }

.stats-line{
  display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  padding-top:12px; font-size:13.5px;
}
.batch-actions{ padding-top:14px; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.batch-prompt{ font-size:13.5px; white-space:pre-wrap; color:var(--ink); margin:0 0 8px; }
.batch-files{ font-size:12.5px; color:var(--ink-2); font-family:var(--font-mono); margin:0; }

.tabs{ display:flex; gap:0; margin-bottom:20px; border-bottom:1px solid var(--line-strong); }
.tab{
  font-family:var(--font-body); font-size:13.5px; font-weight:500;
  background:none; border:none; padding:10px 4px; margin-right:22px;
  color:var(--ink-2); cursor:pointer; border-bottom:2px solid transparent;
  margin-bottom:-1px;
}
.tab:hover{ color:var(--ink); }
.tab-active{ color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }

.freetext-panel, .excel-panel{ display:flex; flex-direction:column; gap:10px; }
.hint{ font-size:13px; color:var(--ink-2); margin:0; max-width:62ch; }
.file-chosen{
  display:flex; align-items:center; gap:10px; padding:12px 14px;
  background:var(--surface-2); border:1px solid var(--line-strong); border-radius:6px;
}
.file-chosen .mono{ font-family:var(--font-mono); font-size:13px; }
.file-size{ font-size:12.5px; color:var(--ink-2); }
.pill-channel{ background:var(--surface-2); color:var(--ink-2); }
.batch-freetext{ font-size:13.5px; white-space:pre-wrap; color:var(--ink); margin:0; }

.changes{ display:flex; flex-direction:column; gap:24px; margin-bottom:16px; }

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  box-shadow:var(--shadow);
  padding:22px 24px 26px;
  display:flex;
  flex-direction:column;
  gap:18px;
}

.card-top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.breadcrumb{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.breadcrumb .code{
  font-family:var(--font-mono);
  font-size:13px;
  width:96px;
  padding:6px 8px;
  background:var(--surface-2);
  border:1px solid var(--line-strong);
  border-radius:5px;
  color:var(--accent);
}
.breadcrumb .sep{ color:var(--ink-3); }

.card-row{ display:flex; gap:16px; flex-wrap:wrap; }
.card-row .field:not(.grow){ flex:0 0 200px; }

.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:640px){ .two-col{ grid-template-columns:1fr; } }

.stakeholders{ border-top:1px solid var(--line); padding-top:16px; margin-top:2px; }
.stakeholders-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.stakeholders-head > span:first-child{ font-size:12px; font-weight:600; color:var(--ink-2); text-transform:uppercase; letter-spacing:0.05em; }

.stakeholder{
  display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap;
  padding:12px 0 12px 16px;
  border-left:2px solid var(--line-strong);
  margin-bottom:4px;
}
.stakeholder .field{ flex:1 1 160px; }
.stakeholder .field.grow{ flex:2 1 220px; }

.table-legend{ font-size:12.5px; color:var(--ink-2); margin:0 0 10px; }
.th-required-legend{ color:var(--clay); font-weight:600; }

.table-wrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:10px;
  box-shadow:var(--shadow);
  background:var(--surface);
  margin-bottom:12px;
}
.changes-table{ width:100%; min-width:760px; border-collapse:collapse; }
.changes-table thead th{
  font-size:12px; font-weight:600; color:var(--ink-2);
  text-transform:uppercase; letter-spacing:0.05em; text-align:left;
  padding:10px 8px; border-bottom:1px solid var(--line-strong); white-space:nowrap;
}
.th-required::after{ content:" *"; color:var(--clay); }
.changes-table td{ padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
.changes-table tbody tr.change-row:hover{ background:var(--surface-2); }
.row-num, .row-num-head{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink-3); text-align:center; width:32px; }
.row-actions{ white-space:nowrap; display:flex; gap:10px; align-items:center; }

.changes-table .cell-input{
  border:1px solid transparent; background:transparent;
  border-radius:4px; padding:6px 8px; width:100%;
}
.changes-table .cell-input:hover{ border-color:var(--line); }
.changes-table .cell-input:focus{ border-color:var(--line-strong); background:var(--surface); }
.changes-table .cell-input.code{ min-width:90px; font-family:var(--font-mono); color:var(--accent); }
.cell-textarea{ min-height:44px; resize:vertical; min-width:160px; }

.drawer-row td{ background:var(--surface-2); border-bottom:1px solid var(--line-strong); padding:18px 20px; }

.link-btn{
  background:none; border:none; padding:0; margin:0;
  font-family:var(--font-body); font-size:13px; font-weight:500;
  color:var(--accent); cursor:pointer;
}
.link-btn:hover{ text-decoration:underline; }
.link-btn.remove{ color:var(--ink-2); }
.link-btn.remove:hover{ color:var(--clay); }
.spacer{ width:1px; }

button, select, input, textarea{ font:inherit; color:inherit; }

.btn{
  appearance:none; cursor:pointer;
  background:var(--surface); color:var(--ink);
  border:1px solid var(--line-strong); border-radius:7px;
  padding:7px 15px; font-size:.87rem; font-weight:500;
  transition:background .12s ease, border-color .12s ease;
}
.btn:hover{ background:var(--surface-2); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
.btn.primary:hover{ filter:brightness(1.08); }
.btn.primary:disabled{ opacity:0.6; cursor:default; filter:none; }
.btn.ghost{ border-color:transparent; background:transparent; color:var(--ink-2); }
.btn.ghost:hover{ background:var(--surface-2); color:var(--ink); }
.btn.small{ padding:4px 9px; font-size:.78rem; }
.btn-add-change{ width:100%; text-align:center; padding:14px; }

.empty{
  border:1px dashed var(--line-strong); border-radius:10px; padding:36px 24px;
  text-align:center; color:var(--ink-2); display:flex; flex-direction:column; gap:14px; align-items:center;
}

.dock{
  position:fixed; left:0; right:0; bottom:0;
  background:var(--surface); border-top:1px solid var(--line);
  padding:14px 24px; display:flex; justify-content:space-between; align-items:center;
  gap:16px; z-index:10;
}
.dock-count{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums; }

.toast{
  position:fixed; bottom:76px; left:50%; transform:translateX(-50%);
  background:var(--clay-soft); color:var(--clay);
  border:1px solid var(--clay); border-radius:7px;
  padding:10px 16px; font-size:13.5px; max-width:90vw; z-index:20;
}

.history{ margin-top:40px; padding-top:28px; border-top:1px solid var(--line-strong); }
.history h2{ font-family:var(--font-display); font-size:1.15rem; font-weight:600; margin:0 0 16px; }

.batch{ background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); margin-bottom:12px; overflow:hidden; }
.live-register{ border-color:var(--accent); margin-bottom:24px; }
.live-register .pill-channel{ background:var(--accent-soft); color:var(--accent); }
.batch summary{
  display:flex; align-items:center; gap:14px; padding:14px 18px; cursor:pointer; list-style:none;
}
.batch summary::-webkit-details-marker{ display:none; }
.batch-date{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink-2); }
.batch-count{ font-size:13px; color:var(--ink-2); margin-left:auto; }
.batch-body{ padding:0 18px 18px; border-top:1px solid var(--line); }
.batch-change{ padding:12px 0; border-bottom:1px solid var(--line); }
.batch-change:last-child{ border-bottom:none; }
.batch-breadcrumb{ font-family:var(--font-mono); font-size:12px; color:var(--accent); margin:0 0 4px; }
.batch-title{ font-weight:600; margin:0 0 4px; }
.batch-stakeholders{ font-size:13px; color:var(--ink-2); margin:0; }
.awaiting{ font-size:13px; color:var(--ink-2); padding-top:12px; margin:0; }
.processed-note{ padding-top:12px; font-size:14px; margin:0; }
.results-list{ list-style:none; padding:0; margin:8px 0 0; display:flex; flex-direction:column; gap:6px; font-size:13.5px; }
.results-list .mono{ font-family:var(--font-mono); font-size:12.5px; color:var(--accent); }

.pill{
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.03em; text-transform:uppercase;
  padding:4px 10px; border-radius:999px; font-weight:600; white-space:nowrap;
}
.pill-warn{ background:var(--amber-soft); color:var(--amber); }
.pill-success{ background:var(--jade-soft); color:var(--jade); }

.rating{ font-weight:600; }
.rating-high{ color:var(--clay); }
.rating-medium{ color:var(--amber); }
.rating-low, .rating-nominimal{ color:var(--jade); }
</style>
</head>
<body>
<div id="root"></div>
<script type="application/json" id="state-data">{"history": [], "current": {"programme": "", "preparedBy": "", "date": "", "mode": "process", "channel": "freetext", "changes": [], "freetext": "", "excelFile": null, "baselineClient": "", "baselineScope": "", "baselineGoLive": "", "baselinePrompt": "", "baselineFiles": []}}</script>
<script id="app-script">
(function(){
  "use strict";

  function uid(prefix){
    if (window.crypto && crypto.randomUUID) return prefix + "-" + crypto.randomUUID().slice(0,8);
    return prefix + "-" + Math.random().toString(36).slice(2,10);
  }

  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }

  function freshStakeholder(){
    return { id: uid("sg"), name:"", rolesHeadcount:"", notes:"" };
  }

  function freshChange(){
    return {
      id: uid("chg"), title:"", l1:"", l2:"", l3:"", l4:"",
      changeType:"Brownfield", asIs:"", toBe:"", steer:"", sourceNote:"",
      stakeholders:[ freshStakeholder() ]
    };
  }

  function defaultState(){
    return {
      history: [],
      current: {
        programme:"", preparedBy:"",
        date: new Date().toISOString().slice(0,10),
        mode:"process",
        channel:"form",
        changes: [],
        freetext:"",
        excelFile:null,
        baselineClient:"",
        baselineScope:"",
        baselineGoLive:"",
        baselinePrompt:"",
        baselineFiles:[]
      }
    };
  }

  var PER_FILE_CAP = 8 * 1024 * 1024;
  var TOTAL_FILE_CAP = 6 * 1024 * 1024;
  var DOC_RE = /\.(docx|xlsx|pptx|pdf|txt|md|csv)$/i;

  function formatBytes(n){
    if (n == null) return "";
    if (n < 1024) return n + " B";
    if (n < 1024*1024) return (n/1024).toFixed(1) + " KB";
    return (n/1024/1024).toFixed(2) + " MB";
  }

  function loadState(){
    var el = document.getElementById("state-data");
    if (el && el.textContent.trim()){
      try {
        var parsed = JSON.parse(el.textContent);
        if (parsed && parsed.current){
          parsed.current = Object.assign({}, defaultState().current, parsed.current);
          parsed.history = parsed.history || [];
          return parsed;
        }
      } catch(e){}
    }
    var base = defaultState();
    try {
      var raw = localStorage.getItem("cia-intake-draft");
      if (raw){
        var draft = JSON.parse(raw);
        if (draft && Array.isArray(draft.changes)) base.current = Object.assign({}, base.current, draft);
      }
    } catch(e){}
    return base;
  }

  var root = document.getElementById("root");
  var state = loadState();
  var artifactCap = null;
  var downloadsCap = null;
  var mcpCap = null;
  if (window.claude && window.claude.use){
    window.claude.use("artifact").then(function(a){ artifactCap = a; });
    window.claude.use("downloads").then(function(d){ downloadsCap = d; });
    window.claude.use("mcp").then(function(m){ mcpCap = m; });
  }

  var LIVE_CIA_BASE_ID = "appFD6GsiE3Jh5rGQ";
  var CHANGE_IMPACTS_TABLE_ID = "tblfZObW243ZAGE7W";
  var FIELD_IMPACT_ID = "fldwB73o4DHTUo65U";
  var FIELD_STAKEHOLDER_GROUP = "fldylnVj77lfTsqwE";
  var FIELD_OVERALL_IMPACT = "fld8RYBqP2R55hPwH";
  var FIELD_RATING = "fld3N4ZH6jKmG418C";

  // Never persisted into state-data — live Airtable data is read fresh each time, not snapshotted.
  var liveRegister = { status: "idle", records: [], totalCount: 0, error: null, cache: null };

  // Never persisted into state-data — purely local table UI state (which rows show their details drawer).
  var expandedChangeIds = {};

  var saveTimer = null;
  function scheduleDraftSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try { localStorage.setItem("cia-intake-draft", JSON.stringify(state.current)); } catch(e){}
    }, 600);
  }

  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById("toast");
    if (!el) return;
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.hidden = true; }, 4500);
  }

  function formatDate(iso){
    if (!iso) return "";
    try { return new Date(iso).toLocaleString(undefined, {dateStyle:"medium", timeStyle:"short"}); }
    catch(e){ return iso; }
  }

  function renderStakeholderRow(c, sh){
    var canRemove = c.stakeholders.length > 1;
    return '<div class="stakeholder" data-change-id="' + c.id + '" data-stakeholder-id="' + sh.id + '">'
      + '<label class="field"><span>Group</span>'
      + '<input type="text" data-field="name" value="' + esc(sh.name) + '" placeholder="e.g. Procurement Approvers"></label>'
      + '<label class="field"><span>Roles / headcount</span>'
      + '<input type="text" data-field="rolesHeadcount" value="' + esc(sh.rolesHeadcount) + '" placeholder="optional"></label>'
      + '<label class="field grow"><span>Notes for this group</span>'
      + '<input type="text" data-field="notes" value="' + esc(sh.notes) + '" placeholder="optional"></label>'
      + (canRemove ? '<button type="button" class="link-btn remove" data-action="remove-stakeholder">Remove</button>' : '<span class="spacer"></span>')
      + '</div>';
  }

  function renderChangesTableHead(){
    return '<thead><tr>'
      + '<th class="row-num-head">#</th>'
      + '<th class="th-required">L1</th>'
      + '<th class="th-required">L2</th>'
      + '<th class="th-required">L3</th>'
      + '<th class="th-required">L4</th>'
      + '<th class="th-required">As-is</th>'
      + '<th class="th-required">To-be</th>'
      + '<th></th>'
    + '</tr></thead>';
  }

  function renderChangeRow(c, idx){
    var expanded = !!expandedChangeIds[c.id];
    var row = '<tr class="change-row" data-change-id="' + c.id + '">'
      + '<td class="row-num">' + (idx + 1) + '</td>'
      + '<td><input class="cell-input code" data-field="l1" value="' + esc(c.l1) + '" placeholder="L1"></td>'
      + '<td><input class="cell-input code" data-field="l2" value="' + esc(c.l2) + '" placeholder="L2"></td>'
      + '<td><input class="cell-input code" data-field="l3" value="' + esc(c.l3) + '" placeholder="L3"></td>'
      + '<td><input class="cell-input code" data-field="l4" value="' + esc(c.l4) + '" placeholder="L4"></td>'
      + '<td><textarea class="cell-input cell-textarea" data-field="asIs" rows="2" placeholder="How this happens now">' + esc(c.asIs) + '</textarea></td>'
      + '<td><textarea class="cell-input cell-textarea" data-field="toBe" rows="2" placeholder="How this will happen">' + esc(c.toBe) + '</textarea></td>'
      + '<td class="row-actions">'
        + '<button type="button" class="btn small ghost" data-action="toggle-change-details">' + (expanded ? "Hide details" : "Details") + '</button>'
        + '<button type="button" class="link-btn remove" data-action="remove-change">Remove</button>'
      + '</td>'
    + '</tr>';
    if (!expanded) return row;
    var types = ["Brownfield","Greenfield","Hybrid"];
    var typeOptions = types.map(function(t){
      return '<option value="' + t + '"' + (c.changeType === t ? " selected" : "") + '>' + t + '</option>';
    }).join("");
    var drawer = '<tr class="drawer-row" data-change-id="' + c.id + '"><td colspan="8">'
      + '<div class="card-row">'
        + '<label class="field grow"><span>Title <em>(optional)</em></span>'
        + '<input type="text" data-field="title" value="' + esc(c.title) + '" placeholder="Short label for this change"></label>'
        + '<label class="field"><span>Change type</span>'
        + '<select data-field="changeType">' + typeOptions + '</select></label>'
      + '</div>'
      + '<label class="field"><span>Anything to know when scoring this? <em>(optional)</em></span>'
      + '<textarea data-field="steer" rows="2" placeholder="e.g. this is an optional new role, so people impact shouldn\'t run high">' + esc(c.steer) + '</textarea></label>'
      + '<label class="field"><span>Where does this come from? <em>(optional)</em></span>'
      + '<input type="text" data-field="sourceNote" value="' + esc(c.sourceNote) + '" placeholder="e.g. CM lead brief, 21 Aug"></label>'
      + '<div class="stakeholders">'
        + '<div class="stakeholders-head"><span>Who does this affect <em>(optional)</em></span>'
        + '<button type="button" class="link-btn" data-action="add-stakeholder">+ Add stakeholder group</button></div>'
        + c.stakeholders.map(function(sh){ return renderStakeholderRow(c, sh); }).join("")
      + '</div>'
    + '</td></tr>';
    return row + drawer;
  }

  function renderHistoryItem(b){
    var pillClass = b.status === "processed" ? "pill-success" : "pill-warn";
    var pillLabel = b.status === "processed" ? "Processed" : "Submitted — awaiting Claude";
    var mode = b.mode || "process";

    if (mode === "baseline"){
      var promptPreview = (b.prompt || "").trim();
      if (promptPreview.length > 320) promptPreview = promptPreview.slice(0,320) + "…";
      var fileNames = (b.files || []).map(function(f){ return f.name; }).join(", ");
      var bBody = '<div class="batch-change">'
        + (promptPreview ? '<p class="batch-prompt">' + esc(promptPreview) + '</p>' : '<p class="batch-prompt">(no prompt text)</p>')
        + (fileNames ? '<p class="batch-files">' + esc(fileNames) + '</p>' : '')
      + '</div>';
      var bTail;
      if (b.status === "processed"){
        var statsLine = "";
        if (b.stats){
          statsLine = '<div class="stats-line">'
            + '<span class="num">' + b.stats.count + ' impacts</span>'
            + (b.stats.high != null ? ' &middot; <span class="rating rating-high">' + b.stats.high + ' High</span>' : "")
            + (b.stats.medium != null ? ' &middot; <span class="rating rating-medium">' + b.stats.medium + ' Medium</span>' : "")
            + (b.stats.low != null ? ' &middot; <span class="rating rating-low">' + b.stats.low + ' Low</span>' : "")
          + '</div>';
        }
        var bNote = b.processedNote ? '<p class="processed-note">' + esc(b.processedNote) + '</p>' : "";
        var actions = '<div class="batch-actions">';
        if (b.csv){
          actions += '<button type="button" class="btn ghost small" data-action="download-register">Download register (.csv)</button>';
        }
        actions += '<span class="hint">Full workbook (' + esc(b.workbookName || "the .xlsx") + ') was delivered in chat.</span></div>';
        bTail = statsLine + bNote + actions;
      } else {
        bTail = '<p class="awaiting">Claude will read this batch, build the baseline, and deliver the workbook in chat. Refresh in a few minutes.</p>';
      }
      return '<details class="batch" data-batch-id="' + b.id + '">'
        + '<summary>'
          + '<span class="pill ' + pillClass + '">' + pillLabel + '</span>'
          + '<span class="pill pill-channel">Baseline CIA</span>'
          + '<span class="batch-date">' + esc(formatDate(b.submittedAt)) + '</span>'
          + '<span class="batch-count">' + esc(b.client || "") + '</span>'
        + '</summary>'
        + '<div class="batch-body">' + bBody + bTail + '</div>'
      + '</details>';
    }

    var channel = b.channel || "form";
    var channelLabel = channel === "freetext" ? "Free text" : channel === "excel" ? "Excel upload" : "Form";
    var countLabel = "";
    var body;
    if (channel === "freetext"){
      var preview = (b.text || "").trim();
      if (preview.length > 240) preview = preview.slice(0,240) + "…";
      body = '<div class="batch-change"><p class="batch-freetext">' + esc(preview || "(empty)") + '</p></div>';
    } else if (channel === "excel"){
      var fname = (b.file && b.file.name) || "(file)";
      var fsize = b.file && b.file.size != null ? formatBytes(b.file.size) : "";
      body = '<div class="batch-change"><p class="batch-title">' + esc(fname) + '</p>'
        + '<p class="batch-stakeholders">' + esc(fsize) + '</p></div>';
    } else {
      var changes = b.changes || [];
      countLabel = changes.length + ' process change' + (changes.length === 1 ? "" : "s");
      body = changes.map(function(c){
        var crumb = [c.l1,c.l2,c.l3,c.l4].filter(Boolean).map(esc).join(" &rsaquo; ") || "(no taxonomy given)";
        var names = (c.stakeholders || []).map(function(s){ return s.name; }).filter(Boolean).map(esc).join(", ") || "no stakeholder groups named";
        return '<div class="batch-change">'
          + '<p class="batch-breadcrumb">' + crumb + '</p>'
          + '<p class="batch-title">' + (esc(c.title) || "(untitled)") + '</p>'
          + '<p class="batch-stakeholders">' + names + '</p>'
        + '</div>';
      }).join("");
    }
    var tail;
    if (b.status === "processed"){
      var note = b.processedNote ? '<p class="processed-note">' + esc(b.processedNote) + '</p>' : "";
      var results = "";
      if (b.results && b.results.length){
        results = '<ul class="results-list">' + b.results.map(function(r){
          var ratingClass = "rating-" + String(r.rating || "").toLowerCase().replace(/[^a-z]/g, "");
          return '<li><span class="mono">' + esc(r.impactId) + '</span> — ' + esc(r.stakeholderGroup) + ' — <span class="rating ' + ratingClass + '">' + esc(r.rating) + '</span></li>';
        }).join("") + '</ul>';
      }
      tail = note + results;
    } else {
      tail = '<p class="awaiting">Claude will read this batch and populate the Airtable register. Refresh in a few minutes.</p>';
    }
    return '<details class="batch" data-batch-id="' + b.id + '">'
      + '<summary>'
        + '<span class="pill ' + pillClass + '">' + pillLabel + '</span>'
        + '<span class="pill pill-channel">' + channelLabel + '</span>'

  function renderHistory(history){
    if (!history.length) return "";
    return '<section class="history"><h2>Submitted batches</h2>' + history.map(renderHistoryItem).join("") + '</section>';
  }

  var RATING_ORDER = ["High", "Medium", "Low", "No / Minimal"];

  function renderLiveRegisterBody(lr){
    if (lr.status === "idle"){
      return '<p class="hint">Reads the live <span class="mono">Change Impacts</span> table directly from your Airtable connector — opens the connector prompt on first use.</p>';
    }
    if (lr.status === "loading"){
      return '<p class="hint">Loading live register…</p>';
    }
    if (lr.status === "unavailable"){
      return '<p class="hint">' + esc(lr.error || "Add the Airtable connector in claude.ai Settings → Connectors to see the live register here.") + '</p>';
    }
    if (lr.status === "error"){
      return '<p class="hint">' + esc(lr.error || "Couldn't load the live register.") + '</p>';
    }
    var counts = { "High": 0, "Medium": 0, "Low": 0, "No / Minimal": 0 };
    lr.records.forEach(function(r){
      var rating = (r.cellValuesByFieldId && r.cellValuesByFieldId[FIELD_RATING]) || "";
      if (Object.prototype.hasOwnProperty.call(counts, rating)) counts[rating] += 1;
    });
    var staleNote = lr.stale ? '<p class="hint">Having trouble reaching Airtable — showing the last data that loaded.</p>' : "";
    var pills = RATING_ORDER.filter(function(k){ return counts[k] > 0; }).map(function(k){
      var cls = "rating-" + k.toLowerCase().replace(/[^a-z]/g, "");
      return '<span class="rating ' + cls + '">' + counts[k] + " " + esc(k) + '</span>';
    }).join(" &middot; ");
    var rows = lr.records.slice(0, 20).map(function(r){
      var c = r.cellValuesByFieldId || {};
      var ratingVal = c[FIELD_RATING] || "";
      var ratingCls = "rating-" + String(ratingVal).toLowerCase().replace(/[^a-z]/g, "");
      return '<li><span class="mono">' + esc(c[FIELD_IMPACT_ID] || r.id) + '</span> — '
        + esc(c[FIELD_STAKEHOLDER_GROUP] || "") + ' — '
        + '<span class="rating ' + ratingCls + '">' + esc(ratingVal) + '</span></li>';
    }).join("");
    var updated = lr.cache && lr.cache.storedAt
      ? '<span class="batch-date">as of ' + esc(formatDate(new Date(lr.cache.storedAt).toISOString())) + '</span>'
      : "";
    return staleNote
      + '<div class="stats-line"><span class="num">' + lr.totalCount + ' impacts</span>'
      + (pills ? ' &middot; ' + pills : '') + '</div>'
      + (rows ? '<ul class="results-list">' + rows + '</ul>' : '')
      + updated;
  }

  function renderLiveRegister(){
    return '<details class="batch live-register" id="live-register">'
      + '<summary>'
        + '<span class="pill pill-channel">Live Register</span>'

  function startLiveRegisterWatch(){
    if (liveRegister.status !== "idle") return;
    if (!mcpCap){
      liveRegister.status = "unavailable";
      liveRegister.error = "AI-powered artifacts / connector access isn't available in this view.";
      writeLiveRegisterBody();
      return;
    }
    liveRegister.status = "loading";
    writeLiveRegisterBody();
    mcpCap.watchTool("Airtable", "list_records_for_table", {
      baseId: LIVE_CIA_BASE_ID,
      tableId: CHANGE_IMPACTS_TABLE_ID,
      fieldIds: [FIELD_IMPACT_ID, FIELD_STAKEHOLDER_GROUP, FIELD_OVERALL_IMPACT, FIELD_RATING],
      pageSize: 100
    }, onLiveRegisterEvent, { refetchInterval: 60000 });
  }

  function onLiveRegisterEvent(ev){
    if (ev.type === "error"){
      var code = ev.error && ev.error.code;
      var authCodes = ["needs_reauth","server_not_connected","selection_required","not_granted","capability_disabled","capability_removed"];
      if (authCodes.indexOf(code) !== -1){
        liveRegister.status = "unavailable";
        liveRegister.records = [];
        liveRegister.error = "Add or reconnect Airtable in claude.ai Settings → Connectors to see the live register.";
      } else if (code === "server_unavailable"){
        liveRegister.stale = liveRegister.records.length > 0;
        if (!liveRegister.stale){ liveRegister.status = "error"; liveRegister.error = "Airtable is temporarily unreachable — it will keep trying."; }
      } else if (code === "blocked_by_policy"){
        liveRegister.status = "error";
        liveRegister.error = "Your organization's policy blocks this connector call.";
      } else if (code === "approval_required"){
        liveRegister.status = "error";
        liveRegister.error = "This call needs approval before it can run.";
      } else if (code === "tool_error"){
        liveRegister.status = "error";
        liveRegister.error = (ev.error && ev.error.message) || "Airtable reported an error.";
      } else {
        liveRegister.status = "error";
        liveRegister.error = "Couldn't load the live register.";
      }
      writeLiveRegisterBody();
      return;
    }
    var payload = (ev.result && ev.result.payload) || {};
    liveRegister.status = "ready";
    liveRegister.stale = false;
    liveRegister.records = payload.records || [];
    liveRegister.totalCount = (payload.metadata && payload.metadata.totalRecordCount != null) ? payload.metadata.totalRecordCount : liveRegister.records.length;
    liveRegister.cache = (ev.result && ev.result.cache) || null;
    writeLiveRegisterBody();
  }

      + '<div class="field"><span>Supporting documents <em>(optional)</em></span>'

  function dockLabel(s){
    var mode = s.current.mode || "process";
    if (mode === "baseline"){
      var promptLen = (s.current.baselinePrompt || "").trim().length;
      var fileCount = (s.current.baselineFiles || []).length;
      var parts = [];
      if (promptLen) parts.push(promptLen + " character" + (promptLen === 1 ? "" : "s"));
      if (fileCount) parts.push(fileCount + " file" + (fileCount === 1 ? "" : "s"));
      return parts.length ? parts.join(", ") + " drafted" : "Nothing drafted yet";
    }
    var channel = s.current.channel || "form";
    if (channel === "freetext"){
      var len = (s.current.freetext || "").trim().length;
      return len ? (len + " character" + (len === 1 ? "" : "s") + " drafted") : "Nothing drafted yet";
    }
    if (channel === "excel"){
      return s.current.excelFile ? ("Ready: " + s.current.excelFile.name) : "No file chosen";
    }
    var n = s.current.changes.length;
    return n + " process change" + (n === 1 ? "" : "s") + " drafted";
  }

  function renderApp(s){
    var mode = s.current.mode || "process";
    var channel = s.current.channel || "form";
    var channelBody = channel === "freetext" ? renderFreetextChannel(s)
      : channel === "excel" ? renderExcelChannel(s)
      : renderFormChannel(s);

    var eyebrow = mode === "baseline" ? "Baseline CIA Generation" : "Process Change Intake";
    var lede = mode === "baseline"
      ? "Describe the transformation in one prompt, attach whatever documents you have, and Claude builds a comprehensive first-pass baseline for the client to validate &mdash; a downloadable workbook, not a live register."
      : "Describe a process change &mdash; what's true today, what changes, and who it lands on. Claude reads whichever channel you use, scores it against the CIA rubric, and writes the register rows into Airtable.";

      ? renderBaselinePanel(s)
      : ('<section class="letterhead">'
          + '<label class="field"><span>Programme</span>'

    var submitLabel = mode === "baseline" ? "Generate baseline CIA" : "Submit to Claude";

    return '<header class="appbar">'
      + '<div class="brand"><h1>Change Impact Intake</h1><small>One process at a time, or a full baseline in one pass</small></div>'

  function buildDocument(s){
    var styleText = document.getElementById("app-style").textContent;
    var scriptText = document.getElementById("app-script").textContent;
    var stateJson = JSON.stringify(s).replace(/</g, "\\u003c");
    return "<!doctype html>\n<html lang=\"en\">\n<head>\n"
      + "<meta charset=\"utf-8\">\n"
      + "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n"
      + "<meta name=\"color-scheme\" content=\"light dark\">\n"
      + "<title>Change Impact Intake</title>\n"
      + "<style id=\"app-style\">" + styleText + "</style>\n"
      + "</head>\n<body>\n"
      + "<div id=\"root\"></div>\n"
      + "<script type=\"application/json\" id=\"state-data\">" + stateJson + "<" + "/script>\n"
      + "<script id=\"app-script\">" + scriptText + "<" + "/script>\n"
      + "</body>\n</html>";
  }

  function findChange(id){
    return state.current.changes.find(function(c){ return c.id === id; });
  }

  root.addEventListener("toggle", function(e){
    if (e.target && e.target.id === "live-register" && e.target.open){
      startLiveRegisterWatch();
    }
  }, true);

  root.addEventListener("input", function(e){
    var t = e.target;
    if (t.type === "file"){
      var fileList = t.files ? Array.prototype.slice.call(t.files) : [];
      if (!fileList.length) return;

      if (t.multiple){
        var existing = state.current.baselineFiles || [];
        var existingTotal = existing.reduce(function(sum,f){ return sum + (f.size||0); }, 0);
        var accepted = [];
        var acceptedTotal = 0;
        var rejectedReason = null;
        fileList.forEach(function(file){
          if (!DOC_RE.test(file.name)){
            rejectedReason = rejectedReason || (file.name + ": unsupported file type.");
            return;
          }
          if (file.size > PER_FILE_CAP){
            rejectedReason = rejectedReason || (file.name + ": over 8MB.");
            return;
          }
          if (existingTotal + acceptedTotal + file.size > TOTAL_FILE_CAP){
            rejectedReason = rejectedReason || "That would put this batch over the 6MB total — remove something first.";
            return;
          }
          accepted.push(file);
          acceptedTotal += file.size;
        });
        if (rejectedReason) toast(rejectedReason);
        if (!accepted.length){ t.value = ""; return; }
        var remaining = accepted.length;
        accepted.forEach(function(file){
          var r = new FileReader();
          r.onload = function(){
            var dataUrl = String(r.result || "");
            var b64 = dataUrl.split(",")[1] || "";
            state.current.baselineFiles.push({ id: uid("file"), name: file.name, size: file.size, base64: b64 });
            remaining -= 1;
            if (remaining === 0) render();
          };
          r.onerror = function(){
            toast("Could not read " + file.name + " — try again.");
            remaining -= 1;
            if (remaining === 0) render();
          };
          r.readAsDataURL(file);
        });
        return;
      }

      var file = fileList[0];
      if (!/\.xlsx$/i.test(file.name)){
        toast("Please choose an .xlsx file.");
        t.value = "";
        return;
      }
      if (file.size > PER_FILE_CAP){
        toast("That file is over 8MB — a filled CIA template is normally well under 1MB.");
        t.value = "";
        return;
      }
      var reader = new FileReader();
      reader.onload = function(){
        var dataUrl = String(reader.result || "");
        var b64 = dataUrl.split(",")[1] || "";
        state.current.excelFile = { name: file.name, size: file.size, base64: b64 };
        render();
      };
      reader.onerror = function(){
        toast("Could not read that file — try again.");
      };
      reader.readAsDataURL(file);
      return;
    }
    var field = t.dataset.field;
    if (!field) return;
    var changeEl = t.closest("[data-change-id]");
    var shEl = t.closest("[data-stakeholder-id]");
    if (changeEl && shEl){
      var c1 = findChange(changeEl.dataset.changeId);
      var sh = c1 && c1.stakeholders.find(function(s){ return s.id === shEl.dataset.stakeholderId; });
      if (sh) sh[field] = t.value;
    } else if (changeEl){
      var c2 = findChange(changeEl.dataset.changeId);
      if (c2) c2[field] = t.value;
    } else {
      state.current[field] = t.value;
    }
    scheduleDraftSave();
  });

  root.addEventListener("click", function(e){
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.dataset.action;
    if (action === "add-change"){
      state.current.changes.push(freshChange());
      render();
    } else if (action === "remove-change"){
      var id = btn.closest("[data-change-id]").dataset.changeId;
      state.current.changes = state.current.changes.filter(function(c){ return c.id !== id; });
      delete expandedChangeIds[id];
      render();
    } else if (action === "toggle-change-details"){
      var tid = btn.closest("[data-change-id]").dataset.changeId;
      if (expandedChangeIds[tid]) delete expandedChangeIds[tid];
      else expandedChangeIds[tid] = true;
      render();
    } else if (action === "add-stakeholder"){
      var cid = btn.closest("[data-change-id]").dataset.changeId;
      var c = findChange(cid);
      if (c) c.stakeholders.push(freshStakeholder());
      render();
    } else if (action === "remove-stakeholder"){
      var changeId = btn.closest("[data-change-id]").dataset.changeId;
      var shId = btn.closest("[data-stakeholder-id]").dataset.stakeholderId;
      var c3 = findChange(changeId);
      if (c3) c3.stakeholders = c3.stakeholders.filter(function(s){ return s.id !== shId; });
      render();
    } else if (action === "switch-channel"){
      state.current.channel = btn.dataset.channel;
      render();
    } else if (action === "remove-file"){
      state.current.excelFile = null;
      render();
    } else if (action === "switch-mode"){
      state.current.mode = btn.dataset.mode;
      render();
    } else if (action === "remove-baseline-file"){
      var fid = btn.closest("[data-file-id]").dataset.fileId;
      state.current.baselineFiles = (state.current.baselineFiles || []).filter(function(f){ return f.id !== fid; });
      render();
    } else if (action === "download-register"){
      downloadRegister(btn);
    } else if (action === "toggle-theme"){
      var docEl = document.documentElement;
      var cur = docEl.getAttribute("data-theme");
      var isDark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      docEl.setAttribute("data-theme", isDark ? "light" : "dark");
    } else if (action === "submit"){
      onSubmit();
    }
  });

  function onSubmit(){
    var mode = state.current.mode || "process";
    if (mode === "baseline"){
      onSubmitBaseline();
      return;
    }
    onSubmitProcess();
  }

  function downloadRegister(btn){
    var detailsEl = btn.closest("[data-batch-id]");
    var batchId = detailsEl && detailsEl.dataset.batchId;
    var batch = state.history.find(function(b){ return b.id === batchId; });
    if (!batch || !batch.csv){
      toast("No register available for this batch.");
      return;
    }
    if (!downloadsCap){
      toast("Downloads aren't available in this view — the full workbook was already delivered in chat.");
      return;
    }
    var filename = (batch.client ? batch.client.replace(/[^A-Za-z0-9 _-]/g,"").trim().replace(/\s+/g,"-") : "baseline-cia") + "-register.csv";
    downloadsCap.save({ filename: filename, data: batch.csv }).catch(function(err){
      if (err && err.code === "declined") return;
      toast("Couldn't save the file — the full workbook is in chat either way.");
    });
  }

  function onSubmitBaseline(){
    var hasPrompt = !!(state.current.baselinePrompt || "").trim();
    var hasFiles = (state.current.baselineFiles || []).length > 0;
    if (!hasPrompt && !hasFiles){
      toast("Describe the transformation or attach a document before submitting.");
      return;
    }
    if (!(state.current.baselineClient || "").trim()){
      toast("Client is required.");
      return;
    }
    if (!(state.current.baselineScope || "").trim()){
      toast("Solution scope is required.");
      return;
    }
    if (!artifactCap){
      toast("Submitting isn't available in this view.");
      return;
    }
    var btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "Submitting…";
    var batch = {
      id: uid("batch"),
      mode: "baseline",
      status: "submitted",
      submittedAt: new Date().toISOString(),
      processedAt: null,
      processedNote: "",
      results: [],
      stats: null,
      workbookName: "",
      csv: "",
      client: state.current.baselineClient,
      scope: state.current.baselineScope,
      goLive: state.current.baselineGoLive,
      prompt: state.current.baselinePrompt,
      files: state.current.baselineFiles
    };
    var next = {
      history: [batch].concat(state.history),
      current: Object.assign({}, state.current, {
        date: new Date().toISOString().slice(0,10),
        baselineClient: "",
        baselineScope: "",
        baselineGoLive: "",
        baselinePrompt: "",
        baselineFiles: []
      })
    };
    artifactCap.publish(buildDocument(next)).then(function(){
      try { localStorage.removeItem("cia-intake-draft"); } catch(e){}
    }).catch(function(err){
      btn.disabled = false;
      btn.textContent = "Generate baseline CIA";
      if (!err || err.code !== "conflict"){
        toast("Could not submit — " + ((err && err.message) || "please try again."));
      }
    });
  }

  function onSubmitProcess(){
    var channel = state.current.channel || "form";
    if (channel === "form" && state.current.changes.length === 0){
      toast("Add at least one process change before submitting.");
      return;
    }
    if (channel === "form" && state.current.changes.length > 0){
      var REQUIRED_FIELDS = [["l1","L1"],["l2","L2"],["l3","L3"],["l4","L4"],["asIs","As-is"],["toBe","To-be"]];
      var missingRows = [];
      state.current.changes.forEach(function(c, i){
        var missing = REQUIRED_FIELDS.filter(function(f){ return !(c[f[0]] || "").trim(); }).map(function(f){ return f[1]; });
        if (missing.length) missingRows.push("Row " + (i + 1) + ": " + missing.join(", "));
      });
      if (missingRows.length){
        var shown = missingRows.slice(0, 3).join(" · ");
        var extra = missingRows.length > 3 ? " (+" + (missingRows.length - 3) + " more row" + (missingRows.length - 3 > 1 ? "s" : "") + ")" : "";
        toast("Fill in the required fields — " + shown + extra);
        return;
      }
    }
    if (channel === "freetext" && !(state.current.freetext || "").trim()){
      toast("Write something before submitting.");
      return;
    }
    if (channel === "excel" && !state.current.excelFile){
      toast("Choose a file before submitting.");
      return;
    }
    if (!artifactCap){
      toast("Submitting isn't available in this view.");
      return;
    }
    var btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "Submitting…";
    var batch = {
      id: uid("batch"),
      channel: channel,
      status: "submitted",
      submittedAt: new Date().toISOString(),
      processedAt: null,
      processedNote: "",
      results: [],
      programme: state.current.programme,
      preparedBy: state.current.preparedBy,
      date: state.current.date
    };
    if (channel === "form") batch.changes = state.current.changes;
    else if (channel === "freetext") batch.text = state.current.freetext;
    else if (channel === "excel") batch.file = state.current.excelFile;

    var next = {
      history: [batch].concat(state.history),
      current: {
        programme: state.current.programme,
        preparedBy: state.current.preparedBy,
        date: new Date().toISOString().slice(0,10),
        channel: channel,
        changes: [],
        freetext: "",
        excelFile: null
      }
    };
    artifactCap.publish(buildDocument(next)).then(function(){
      try { localStorage.removeItem("cia-intake-draft"); } catch(e){}
    }).catch(function(err){
      btn.disabled = false;
      btn.textContent = "Submit to Claude";
      if (!err || err.code !== "conflict"){
        toast("Could not submit — " + ((err && err.message) || "please try again."));
      }
    });
  }

  render();
})();
</script>
</body>
</html>
