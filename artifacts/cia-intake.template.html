  function onSubmitProcess(){
    var channel = state.current.channel || "form";
    if (channel === "form" && state.current.changes.length === 0){
      toast("Add at least one process change before submitting.");
      return;
    }
    if (channel === "form" && state.current.changes.length > 0){
      var REQUIRED_FIELDS = [["l1","L1"],["l2","L2"],["l3","L3"],["l4","L4"],["asIs","As-is"],["toBe","To-be"]];
      var missingRows = [];
      state.current.changes.forEach(function(c, i){
        var missing = REQUIRED_FIELDS.filter(function(f){ return !(c[f[0]] || "").trim(); }).map(function(f){ return f[1]; });
        if (missing.length) missingRows.push("Row " + (i + 1) + ": " + missing.join(", "));
      });
      if (missingRows.length){
        var shown = missingRows.slice(0, 3).join(" · ");
        var extra = missingRows.length > 3 ? " (+" + (missingRows.length - 3) + " more row" + (missingRows.length - 3 > 1 ? "s" : "") + ")" : "";
        toast("Fill in the required fields — " + shown + extra);
        return;
      }
    }
    if (channel === "freetext" && !(state.current.freetext || "").trim()){
      toast("Write something before submitting.");
      return;
    }
    if (channel === "excel" && !state.current.excelFile){
      toast("Choose a file before submitting.");
      return;
    }
    if (!artifactCap){
      toast("Submitting isn't available in this view.");
      return;
    }
    var btn = document.getElementById("submit-btn");
    btn.disabled = true;
    btn.textContent = "Submitting…";
    var batch = {
      id: uid("batch"),
      channel: channel,
      status: "submitted",
      submittedAt: new Date().toISOString(),
      processedAt: null,
      processedNote: "",
      results: [],
      programme: state.current.programme,
      preparedBy: state.current.preparedBy,
      date: state.current.date
    };
    if (channel === "form") batch.changes = state.current.changes;
    else if (channel === "freetext") batch.text = state.current.freetext;
    else if (channel === "excel") batch.file = state.current.excelFile;

    var next = {
      history: [batch].concat(state.history),
      current: Object.assign({}, state.current, {
        date: new Date().toISOString().slice(0,10),
        channel: channel,
        changes: [],
        freetext: "",
        excelFile: null
      })
    };
    try { sessionStorage.setItem("cia-intake-pending", JSON.stringify({batchId: batch.id, current: state.current})); } catch(e){}
    // The in-page pipeline continues this batch after the reload the publish causes.
    if (inPageChannel(batch)) writePipelineKey({ batchId: batch.id, token: pageToken, startedAt: Date.now() });
    artifactCap.publish(buildDocument(next)).then(function(){
      try { localStorage.removeItem("cia-intake-draft"); } catch(e){}
      try { sessionStorage.removeItem("cia-intake-pending"); } catch(e){}
    }).catch(function(err){
      btn.disabled = false;
      btn.textContent = "Submit to Claude";
      clearPipelineKey();
      if (!err || err.code !== "conflict"){
        toast("Could not submit — " + ((err && err.message) || "please try again."));
        try { sessionStorage.removeItem("cia-intake-pending"); } catch(e){}
      }
    });
  }

  // ---- In-page pipeline: claim -> score (sample) -> allocate IDs -> push (Airtable) -> processed.
  // Every publish reloads this view, so each stage is one page load; sessionStorage carries the
  // stage outputs across. See reference/intake-worker.md.

  function readPipelineKey(){
    try { var raw = sessionStorage.getItem(PIPELINE_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
  }
  function writePipelineKey(k){ try { sessionStorage.setItem(PIPELINE_KEY, JSON.stringify(k)); } catch(e){} }
  function clearPipelineKey(){ try { sessionStorage.removeItem(PIPELINE_KEY); } catch(e){} }
  function findBatch(id){ return state.history.find(function(b){ return b.id === id; }); }
  function noop(){}

  function publishBatchPatch(batchId, patch, topPatch){
    var history = state.history.map(function(b){ return b.id === batchId ? Object.assign({}, b, patch) : b; });
    var next = Object.assign({}, state, { history: history }, topPatch || {});
    delete next._recoveredPending;
    return artifactCap.publish(buildDocument(next));
  }

  function onPublishError(err){
    if (err && err.code === "conflict") return; // this view reloads to the winner; the key resumes there
    pipeline.active = null;
    pipeline.abort = null;
    toast("Could not save progress — " + ((err && err.message) || "please try again."));
    refreshHistory();
  }

  function setProgress(batchId, label, text){
    pipeline.active = { batchId: batchId, label: label, text: text };
    var pill = document.getElementById("batch-pill-" + batchId);
    var prog = document.getElementById("batch-progress-" + batchId);
    if (pill && prog){
      pill.textContent = label;
      prog.innerHTML = renderProgress({ id: batchId }).replace(/^<div[^>]*>|<\/div>$/g, "");
    } else {
      refreshHistory();
    }
  }

  var ABSENT_CODES = ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed",
    "server_not_connected","needs_reauth","selection_required","not_in_manifest","consent_required","user_changed"];

  function reasonFor(err, stage){
    var code = err && err.code;
    var msg = (err && err.message) || "";
    if (code === "invalid_json") return "Claude's reply was not valid JSON, so nothing was written. Retry, or add detail to the as-is / to-be so the rows are clearer.";
    if (code === "refused") return "Claude declined to score this content. Reword the batch and retry.";
    if (code === "empty_completion") return "Claude returned an empty answer. Retry once; if it repeats, split the batch.";
    if (code === "prompt_too_large") return "This batch is too long to score in one go. Split it into smaller batches.";
    if (code === "rate_limited") return "Too many requests right now. Wait a minute and retry.";
    if (code === "tool_error") return "Airtable rejected the write: " + (msg || "unknown error") + ". Check the Change Impacts table and retry.";
    if (code === "blocked_by_policy") return "Your organization's policy blocks this Airtable call. Claude in chat can push this batch instead.";
    if (code === "approval_required") return "This Airtable call needs approval before it can run. Claude in chat can push this batch instead.";
    if (code === "server_unavailable" || code === "upstream_error") return "Airtable or Claude was unreachable during " + stage + ". Retry in a minute.";
    return "Failed during " + stage + (msg ? ": " + msg : "") + ". Retry, or ask Claude in chat.";
  }

  function computeRating(r){
    var avg = Math.round(((r.score_people + r.score_process + r.score_technology) / 3) * 100) / 100;
    if (avg >= 2.5) return "High";
    if (avg >= 1.5) return "Medium";
    if (avg >= 0.5) return "Low";
    return "No / Minimal";
  }

  function clampScore(v){
    var n = parseInt(v, 10);
    if (isNaN(n)) return 0;
    return Math.max(0, Math.min(3, n));
  }
  function cleanText(v){
    if (v == null) return "";
    return String(v).slice(0, MAX_TEXT_LEN);
  }

  // sample() output is untrusted: keep only known keys, coerce every value into its field's
  // domain, cap the row count at one upsert request.
  function validateScoredRows(raw){
    var out = { rows: [], note: "" };
    if (!Array.isArray(raw)) return out;
    raw.forEach(function(src){
      if (!src || typeof src !== "object" || Array.isArray(src)) return;
      var r = {};
      Object.keys(TEXT_FIELDS).forEach(function(k){ var t = cleanText(src[k]); if (t) r[k] = t; });
      r.notes = cleanText(src.notes);
      Object.keys(NUMBER_FIELDS).forEach(function(k){
        if (src[k] == null || src[k] === "") return;
        var n = Number(src[k]);
        if (isFinite(n)) r[k] = n;
      });
      Object.keys(SCORE_FIELDS).forEach(function(k){ r[k] = clampScore(src[k]); });
      Object.keys(SELECT_FIELDS).forEach(function(k){
        var allowed = SELECT_FIELDS[k][1];
        var v = src[k] == null ? "" : String(src[k]).trim();
        var hit = allowed.find(function(a){ return a.toLowerCase() === v.toLowerCase(); });
        if (hit) r[k] = hit;
        else if (k === "confidence") r[k] = "Low";
      });
      if (!r.stakeholder_group) r.stakeholder_group = "(unspecified)";
      out.rows.push(r);
    });
    if (out.rows.length > MAX_ROWS_PER_BATCH){
      out.note = "Claude proposed " + out.rows.length + " rows; only the first " + MAX_ROWS_PER_BATCH + " were written. Split the rest into another batch.";
      out.rows = out.rows.slice(0, MAX_ROWS_PER_BATCH);
    }
    return out;
  }

  function buildScoringPrompt(b){
    var head = "Channel: " + (b.channel === "freetext" ? "free text" : "form") + "\n"
      + "Programme: " + (b.programme || "(not given)") + "\n"
      + "Prepared by: " + (b.preparedBy || "(not given)") + "\n"
      + "Date: " + (b.date || "") + "\n\n";
    var body;
    if (b.channel === "freetext"){
      body = String(b.text || "");
      if (body.length > FREETEXT_PROMPT_CAP) body = body.slice(0, FREETEXT_PROMPT_CAP) + "\n[truncated at 30,000 characters]";
    } else {
      body = JSON.stringify((b.changes || []).map(function(c){
        return {
          title: c.title, l1: c.l1, l2: c.l2, l3: c.l3, l4: c.l4, changeType: c.changeType,
          asIs: c.asIs, toBe: c.toBe, scoringSteer: c.steer, source: c.sourceNote,
          stakeholderGroups: (c.stakeholders || []).filter(function(s){ return (s.name || "").trim(); }).map(function(s){
            return { group: s.name, rolesHeadcount: s.rolesHeadcount, notes: s.notes };
          })
        };
      }), null, 1);
    }
    return RUBRIC_BLOCK + "\n\n<<<BATCH\n" + head + body + "\nBATCH>>>\n";
  }

  function toAirtableFields(r, b){
    var f = {};
    Object.keys(TEXT_FIELDS).forEach(function(k){ if (r[k]) f[TEXT_FIELDS[k]] = r[k]; });
    Object.keys(NUMBER_FIELDS).forEach(function(k){ if (r[k] != null) f[NUMBER_FIELDS[k]] = r[k]; });
    Object.keys(SCORE_FIELDS).forEach(function(k){ f[SCORE_FIELDS[k]] = clampScore(r[k]); });
    Object.keys(SELECT_FIELDS).forEach(function(k){ if (r[k]) f[SELECT_FIELDS[k][0]] = r[k]; });
    f[FIELD_IMPACT_ID] = r.impactId;
    f[FIELD_INTAKE_KEY] = r.intakeKey;
    f[FIELD_VALIDATION_STATUS] = "Draft";
    f[FIELD_SOURCE_TYPE] = "Project Evidence";
    f[FIELD_SOURCE_REF] = "Intake " + b.id;
    f[FIELD_NOTES] = (r.notes ? r.notes + "\n" : "")
      + "Provisionally scored in-page from intake batch " + b.id + " on " + new Date().toISOString().slice(0,10) + "; validate before use.";
    return f;
  }

  function readAirtableMax(retried){
    return mcpCap.callTool("Airtable", "list_records_for_table", {
      baseId: LIVE_CIA_BASE_ID,
      tableId: CHANGE_IMPACTS_TABLE_ID,
      fieldIds: [FIELD_IMPACT_ID],
      sort: [{ fieldId: FIELD_IMPACT_ID, direction: "desc" }],
      pageSize: 50
    }, { cache: false }).then(function(res){
      var recs = (res && res.payload && res.payload.records) || [];
      var max = 0;
      recs.forEach(function(rec){
        var v = rec.cellValuesByFieldId && rec.cellValuesByFieldId[FIELD_IMPACT_ID];
        var m = /^CI-(\d+)$/.exec(String(v || ""));
        if (m) max = Math.max(max, parseInt(m[1], 10));
      });
      return max;
    }).catch(function(err){
      if (!retried && err && err.retryable){
        return new Promise(function(r){ setTimeout(r, 1500 + Math.random() * 1500); }).then(function(){ return readAirtableMax(true); });
      }
      throw err;
    });
  }

  function claimBatch(b){
    setProgress(b.id, "Claiming…", "Reserving this batch for scoring in this window.");
    return publishBatchPatch(b.id, {
      status: "claimed", claimedBy: pageToken, claimedAt: new Date().toISOString(),
      leaseMs: LEASE_MS, attempts: (b.attempts || 0) + 1, failReason: ""
    }).catch(onPublishError);
  }

  function releaseBatch(b){
    clearPipelineKey();
    pipeline.active = null;
    pipeline.abort = null;
    return publishBatchPatch(b.id, { status: "submitted", claimedBy: null, claimedAt: null }).catch(onPublishError);
  }

  function failBatch(b, reason){
    clearPipelineKey();
    pipeline.active = null;
    pipeline.abort = null;
    return publishBatchPatch(b.id, { status: "failed", failReason: reason, claimedBy: null }).catch(onPublishError);
  }

  function scoreStage(b, key){
    setProgress(b.id, "Scoring…", "Claude is scoring this batch against the CIA rubric. This usually takes one to two minutes.");
    var ctl = new AbortController();
    pipeline.abort = ctl;
    var pill = document.getElementById("batch-progress-" + b.id);
    if (pill) setProgress(b.id, "Scoring…", pipeline.active.text);
    return sampleCap.json(buildScoringPrompt(b), { modelTier: "default", signal: ctl.signal }).then(function(raw){
      pipeline.abort = null;
      var v = validateScoredRows(raw);
      if (!v.rows.length) return failBatch(b, "Claude returned no usable rows for this batch. Add detail to the as-is / to-be and retry.");
      key.rows = v.rows;
      if (v.note) key.note = v.note;
      writePipelineKey(key);
      return allocateStage(b, key);
    });
  }

  function allocateStage(b, key){
    setProgress(b.id, "Allocating IDs…", "Reading the register to allocate Impact IDs.");
    return readAirtableMax().then(function(max){
      var seq = Math.max(state.nextImpactSeq || 1, max + 1);
      var rows = key.rows.map(function(r, i){
        return Object.assign({}, r, { impactId: "CI-" + String(seq + i).padStart(3, "0"), intakeKey: b.id + ":" + i });
      });
      setProgress(b.id, "Saving…", "Recording the allocated Impact IDs.");
      return publishBatchPatch(b.id, { rows: rows }, { nextImpactSeq: seq + rows.length }).catch(onPublishError);
    });
  }

  function pushStage(b, key){
    setProgress(b.id, "Pushing to Airtable…", "Writing " + b.rows.length + " draft row" + (b.rows.length === 1 ? "" : "s") + " to the Change Impacts table.");
    var records = b.rows.map(function(r){ return { fields: toAirtableFields(r, b) }; });
    return mcpCap.callTool("Airtable", "update_records_for_table", {
      baseId: LIVE_CIA_BASE_ID,
      tableId: CHANGE_IMPACTS_TABLE_ID,
      records: records,
      performUpsert: { fieldIdsToMergeOn: [FIELD_INTAKE_KEY] },
      typecast: false
    }).then(function(res){
      var recs = (res && res.payload && res.payload.records) || [];
      key.pushed = { recordIds: recs.map(function(r){ return r.id; }) };
      writePipelineKey(key);
      return finishStage(b, key);
    });
  }

  function finishStage(b, key){
    setProgress(b.id, "Finishing…", "Marking this batch processed.");
    var ids = (key.pushed && key.pushed.recordIds) || [];
    var results = b.rows.map(function(r, i){
      return { impactId: r.impactId, stakeholderGroup: r.stakeholder_group, rating: computeRating(r), recordId: ids[i] || "" };
    });
    var note = "Scored in the contributor's browser and written to Airtable as Draft rows; validate before use."
      + (key.note ? " " + key.note : "");
    if (mcpCap && mcpCap.invalidate){
      try { mcpCap.invalidate("Airtable", "list_records_for_table").catch(noop); } catch(e){}
    }
    return publishBatchPatch(b.id, {
      status: "processed", processedAt: new Date().toISOString(), processedNote: note, results: results, claimedBy: null
    }).then(function(){ clearPipelineKey(); }).catch(onPublishError);
  }

  function runPipeline(b, key){
    var stage = "scoring";
    var p;
    if (b.status === "submitted"){
      if (!(sampleCap && mcpCap)){ pipeline.active = null; clearPipelineKey(); refreshHistory(); return Promise.resolve(); }
      p = claimBatch(b);
    } else if (b.status === "claimed"){
      if (b.claimedBy !== pageToken){ pipeline.active = null; clearPipelineKey(); refreshHistory(); return Promise.resolve(); }
      if (key.pushed){ stage = "finishing"; p = finishStage(b, key); }
      else if (b.rows && b.rows.length && b.rows[0].impactId){ stage = "the Airtable push"; p = pushStage(b, key); }
      else if (!(sampleCap && mcpCap)){ p = releaseBatch(b); }
      else if (key.rows){ stage = "ID allocation"; p = allocateStage(b, key); }
      else { p = scoreStage(b, key); }
    } else {
      pipeline.active = null; clearPipelineKey(); refreshHistory();
      return Promise.resolve();
    }
    return p.catch(function(err){
      pipeline.abort = null;
      var code = err && err.code;
      if (code === "cancelled" || ABSENT_CODES.indexOf(code) !== -1) return releaseBatch(b);
      return failBatch(b, reasonFor(err, stage));
    });
  }

  function resumePipeline(){
    var key = readPipelineKey();
    if (!key || !key.batchId) return;
    if (!key.startedAt || Date.now() - key.startedAt > PIPELINE_TTL_MS){ clearPipelineKey(); return; }
    var b = findBatch(key.batchId);
    if (!b || b.status === "processed" || b.status === "failed" || !inPageChannel(b)){ clearPipelineKey(); return; }
    if (workerPaused()){ clearPipelineKey(); return; }
    if (b.status === "claimed" && b.claimedBy !== key.token){ clearPipelineKey(); return; }
    if (key.token) pageToken = key.token;
    pipeline.active = { batchId: b.id, label: "Working…", text: "Resuming…" };
    capsReady.then(function(){
      if (!artifactCap){ pipeline.active = null; clearPipelineKey(); refreshHistory(); return; }
      return runPipeline(findBatch(b.id), key);
    });
  }

  // "Score & push now" / "Retry": claim the batch for this window; the reload continues it.
  function startPipelineFor(batchId){
    var b = findBatch(batchId);
    if (!b || !canProcessInPage(b)){ toast("Scoring here needs Airtable and Claude access for this page."); return; }
    if (workerPaused()){ toast("Processing is paused for this page."); return; }
    if (b.status === "processed" || pipelineHere(b)) return;
    if (b.status === "claimed" && !leaseExpired(b)){ toast("Another window is already working on this batch."); return; }
    writePipelineKey({ batchId: b.id, token: pageToken, startedAt: Date.now() });
    claimBatch(b);
  }

  resumePipeline();
  render();
  capsReady.then(refreshHistory);
  if (state._recoveredPending){
    delete state._recoveredPending;
    toast("Someone else's batch was processed while you were writing — your entry is back in the form, press Submit again.");
  }
})();
</script>
